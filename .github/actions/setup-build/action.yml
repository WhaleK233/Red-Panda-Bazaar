name: 准备构建环境
description: |
  安装编译本模组所需的 .NET SDK、游戏参考程序集与 StardewUI 源码。
  CI 的编译检查与 CD 的 RC 发布共用本动作，确保两处编译条件完全一致。

runs:
  using: composite
  steps:
    # StardewUI.Core 用到 C# 13/14 语法，net6.0 默认的 C# 10 编译不过；
    # 因此不用 Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment——
    # 它会把 SDK 固定回 6.0，只借用它的参考程序集步骤。
    - name: 准备 .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    # 游戏与 SMAPI 的公开 API 空壳（无实现），克隆到指定目录；
    # 调用方用 -p:GamePath 显式指过去，不依赖 ModBuildConfig 的自动探测顺序。
    # 原先经 Pathoschild/SMAPI-ModBuildWorkflow/add-reference-assemblies@v1 转发，
    # 但其内部固定用 checkout@v4（Node 20 弃用告警的来源）且无法透传，
    # 这里直接 checkout 同一仓库等价替代（它也只是 clone 后挪目录）
    - name: 准备游戏参考程序集
      uses: actions/checkout@v5
      with:
        repository: StardewModders/mod-reference-assemblies
        ref: main
        fetch-depth: 1
        path: _game

    # UI 框架是本 mod 的编译期共享源码项目，路径由 StardewUICorePath 指定。
    # ref 钉到本地 Projects/StardewUI 的同一提交（dev-unofficial 分支），保证 CI 产物与本地构建
    # 完全一致；升级本地框架检出时同步更新此值，不钉住会随上游移动产生构建漂移
    - name: 检出 StardewUI
      uses: actions/checkout@v5
      with:
        repository: Mushymato/StardewUI
        ref: 355eefc0358c8e39ba925ad7800d6cc93e51c9f8
        path: _stardewui
